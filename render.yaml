services:
  - type: web
    name: apex-hivestrike
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ASK_PER_HOUR
        value: "10"
      - key: ASK_PER_DAY
        value: "200"
